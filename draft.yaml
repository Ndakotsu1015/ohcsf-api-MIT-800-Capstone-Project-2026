# seeders: GeopoliticalZone, State, Lga, Ministry, Agency, Branch, Designation, Department, Division, Unit, Deployment, Redeployment

models:
  Cadre:
    name: string
    description: text nullable
    relationships:
      hasMany: GradeLevel, Deployment

  GradeLevel:
    level: string
    description: text nullable
    relationships:
      belongsTo: Cadre
      hasMany: Deployment

controllers:
  Cadre:
    resource: api
  GradeLevel:
    resource: api

seeders: Cadre, GradeLevel
